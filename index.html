<!doctype html><html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b00020"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<title>METHANE Sitrep</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:18px/1.4 system-ui,sans-serif;padding:12px 12px 80px}
h1{font-size:22px;margin:0;color:#ff5252;text-align:center;flex:1;line-height:1.1}h1 small{display:block;color:#bbb;font-size:13px}
.hdr{display:flex;align-items:center;gap:10px;margin:4px 0 12px;padding-bottom:10px;border-bottom:2px solid #333}
.emb{background:#fff;border-radius:50%;width:64px;height:64px;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #ff5252}.emb img{width:58px;height:58px;border-radius:50%}
.ehs{height:40px;width:auto;flex:none}.rlogo{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.rlogo .emb{width:44px;height:44px}.rlogo .emb img{width:40px;height:40px;border-radius:50%}.rlogo .ehs{height:26px}button,select,input,textarea{font:inherit;border-radius:10px}
button{min-height:56px;padding:10px 14px;border:2px solid #fff;background:#222;color:#fff;font-weight:700}
button.p{background:#b00020;border-color:#ff5252}button.on{background:#ffd600;color:#000}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row>*{flex:1 1 140px}
.f{border:2px solid #444;border-radius:12px;padding:10px;margin:10px 0}.f.act{border-color:#ffd600}
.f label{display:block;font-weight:800;font-size:20px}.f label b{color:#ffd600;font-size:26px;margin-right:6px}
.h{color:#bbb;font-size:15px;margin:2px 0 6px}
textarea,input,select{width:100%;background:#111;color:#fff;border:2px solid #666;padding:10px;min-height:52px}
.cas{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.cas div{text-align:center;font-weight:800;border-radius:10px;padding:4px 3px;font-size:15px}.cas input{text-align:center;font-size:22px;font-weight:800;padding:6px 2px}
.t_red{background:#d50000}.t_yellow{background:#ffd600;color:#000}.t_green{background:#00a843}.t_black{background:#000;border:2px solid #fff}.t_white{background:#fff;color:#000}.cas .t_yellow input,.cas .t_white input{background:#fff;color:#000;border-color:#000}
#live{min-height:40px;background:#111;border:1px dashed #666;padding:8px;border-radius:10px;color:#ffd600}
pre{white-space:pre-wrap;background:#111;border:2px solid #fff;padding:10px;border-radius:10px;font-size:17px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}.thumbs span{position:relative}.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:2px solid #666}.thumbs button{position:absolute;top:-6px;right:-6px;min-height:32px;width:32px;padding:0;border-radius:50%;background:#b00020}
.mts{margin-top:8px;padding:8px;border:2px solid #ffd600;border-radius:10px}.mts .row{margin:4px 0 0}.mts .row>*{flex:1 1 90px}
.hint{color:#bbb;font-size:14px;margin:4px 0}.hist div{border-bottom:1px solid #444;padding:8px 0}
</style></head><body>
<header class="hdr"><span class="emb"><img src="epso-emblem.webp" alt="EPSO emblem"></span><h1>METHANE Sitrep<small>JESIP</small></h1><img class="ehs" src="ehs-logo.webp" alt="EHS"></header>
<div class="row"><input id="callsign" spellcheck="false" autocorrect="off" autocapitalize="characters" autocomplete="off" placeholder="Callsign (e.g. Medic 1)"></div>
<div class="row"><button id="dict" class="p">🎤 Dictate</button><button id="guided">🧭 Guided</button><button id="clear">Clear</button></div>
<div id="live" aria-live="polite">Say e.g. “major incident declared… location… type… hazards… access… casualties… services…”</div>
<form id="form"></form>
<div class="f" id="f_photos"><label><b>📷</b>Photos</label><div class="h">Camera or gallery. Stored on this device only.</div>
<input type="file" id="photoin" accept="image/*" capture="environment" multiple hidden>
<div class="row"><button type="button" id="addph">📷 Add photos</button></div><div class="thumbs" id="thumbs"></div></div>
<div class="row"><button class="p" id="gen">Generate report</button></div>
<div class="rlogo" id="rlogo" hidden><span class="emb"><img src="epso-emblem.webp" alt=""></span><img class="ehs" src="ehs-logo.webp" alt=""></div><pre id="out" hidden></pre>
<div class="row" id="acts" hidden>
<button id="share">📤 Share</button><button id="sms">💬 SMS</button><button id="email">✉️ Email</button>
<button id="teams">Teams</button><button id="read">🔊 Read aloud</button><button id="copy">📋 Copy</button></div>
<div class="hint" id="phint" hidden>📷 Photos attach only via <b>Share</b>; SMS, Email and Teams send text only.</div>
<h2>History</h2><div class="hist" id="hist"></div>
<script>
const TRI=[['red','Red'],['yellow','Yellow'],['green','Green'],['black','Black'],['white','White']];
const F=[
['M','Major incident','Declared or on standby? (any agency may declare)','major',['major incident','major']],
['E1','Exact location','Grid ref / what3words / postcode / landmark','loc',['exact location','location','grid reference','what three words','postcode']],
['T','Type of incident','e.g. RTC, fire, explosion, CBRN, flooding, vehicles/buildings involved','type',['type of incident','incident type','type']],
['H','Hazards','Present and potential hazards','haz',['hazards','hazard']],
['A','Access','Safe routes in/out, RVP, marshalling area','access',['access routes','access','rendezvous point','rvp']],
['N','Number & type of casualties','Number, type and severity (triage)','cas',['number of casualties','casualties','number']],
['E2','Emergency services','Present on scene and required','es',['emergency services','services present','services']],
['+','Summary / Updates','Overall summary and time-stamped updates','sum',['summary','updates','update']]];
const $=id=>document.getElementById(id),form=$('form');
form.innerHTML=F.map(([k,t,h,id])=>`<div class="f" id="f_${id}"><label><b>${k[0]}</b>${t}</label><div class="h">${h}</div>`+
(id=='major'?`<select id="major_s"><option value="">— select —</option><option>MAJOR INCIDENT DECLARED</option><option>MAJOR INCIDENT STANDBY</option><option>NOT DECLARED</option></select><div id="mts" class="mts" hidden><span class="h">Declared / standby at (24h)</span><div class="row"><input type="text" id="m_time" inputmode="numeric" pattern="[0-2][0-9]:[0-5][0-9]" maxlength="5" placeholder="HH:MM" autocomplete="off" spellcheck="false" aria-label="Declaration time (24h)"><input type="date" id="m_date" aria-label="Declaration date"><button type="button" id="m_now">🕒 Now</button></div></div>`:'')+
(id=='cas'?`<div class="cas">${TRI.map(([k,l])=>`<div class="t_${k}"><span>${l}</span><input type="number" min=0 inputmode=numeric id="${k}" aria-label="${l} count"></div>`).join('')}</div><div class="h">White = uninjured, accounted for</div>`:'')+
(id=='sum'?`<div class="row"><button type="button" id="addupd">🕒 Add update</button></div>`:'')+(id=='loc'?`<div class="row"><button type="button" id="gps">📍 Use GPS</button></div>`:'')+
`<textarea id="${id}" rows="2"></textarea></div>`).join('');
document.querySelectorAll('textarea,input:not([type])').forEach(e=>{const off=e.id=='callsign'||e.id=='loc';e.spellcheck=!off;e.setAttribute('spellcheck',!off);e.setAttribute('autocorrect',off?'off':'on');e.setAttribute('autocapitalize',off?(e.id=='loc'?'none':'characters'):'sentences');e.lang='en-GB'});
const S='methane_draft';const ids=[...form.querySelectorAll('input,select,textarea')].map(e=>e.id).concat('callsign');
try{const d=JSON.parse(localStorage[S]||'{}');[['p1','red'],['p2','yellow'],['p3','green'],['dead','black']].forEach(([o,k])=>{if(d[o]!=null&&d[k]==null)d[k]=d[o]});ids.forEach(i=>{if(d[i]!=null)$(i).value=d[i]})}catch(e){}
setTimeout(()=>{prevM=$('major_s').value;$('mts').hidden=!/^MAJOR INCIDENT (DECLARED|STANDBY)$/.test(prevM)});
document.addEventListener('input',()=>{const d={};ids.forEach(i=>d[i]=$(i).value);localStorage[S]=JSON.stringify(d)});
$('major_s').onchange=onMajor;$('m_now').onclick=()=>{stampNow();save()};
$('gps').onclick=()=>{if(!navigator.geolocation)return alert('No geolocation');$('gps').textContent='Locating…';
navigator.geolocation.getCurrentPosition(p=>{const{latitude:a,longitude:o,accuracy:c}=p.coords;
$('loc').value=($('loc').value?$('loc').value+'\n':'')+`GPS ${a.toFixed(5)}, ${o.toFixed(5)} (±${Math.round(c)}m) https://maps.google.com/?q=${a.toFixed(5)},${o.toFixed(5)}`;$('gps').textContent='📍 Use GPS';save()},
e=>{alert('GPS failed: '+e.message);$('gps').textContent='📍 Use GPS'},{enableHighAccuracy:true,timeout:15000})};
function save(){document.dispatchEvent(new Event('input'))}
const NUM={zero:0,none:0,no:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,fifteen:15,twenty:20};
function n(w){return w in NUM?NUM[w]:parseInt(w)}
function parseCas(t){const L=t.toLowerCase(),R={red:'red|p ?1|p one|priority one|immediate',yellow:'yellow|p ?2|p two|priority two|urgent',green:'green|p ?3|p three|priority three|delayed|walking wounded',black:'black|dead|deceased|fatalit(?:y|ies)|p ?4',white:'white|uninjured|unhurt|accounted for'};
for(const k in R){const re=new RegExp('(\\w+)\\s+(?:x\\s*)?(?:'+R[k]+')\\b','g');let m,v=null;while(m=re.exec(L))if(!isNaN(n(m[1])))v=n(m[1]);if(v!=null)$(k).value=v}}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function stampNow(){const d=new Date(),p=x=>String(x).padStart(2,'0');$('m_time').value=p(d.getHours())+':'+p(d.getMinutes());$('m_date').value=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
let prevM=null;function onMajor(){const v=$('major_s').value,on=/DECLARED$|STANDBY$/.test(v)&&v!='NOT DECLARED';
if(on){if(v!==prevM||!$('m_time').value)stampNow()}else{$('m_time').value='';$('m_date').value=''}$('mts').hidden=!on;prevM=v;save()}
function declStr(){const t=$('m_time').value,d=$('m_date').value;if(!t)return'';let ds='';if(d){const[y,m,dd]=d.split('-');ds=`, ${+dd} ${MON[m-1]} ${y}`}return ` at ${t}${ds}`}
function setMajor(t){const L=t.toLowerCase();if(/stand ?by/.test(L))$('major_s').value='MAJOR INCIDENT STANDBY';else if(/not|no major/.test(L))$('major_s').value='NOT DECLARED';else if(/declar|yes|major/.test(L))$('major_s').value='MAJOR INCIDENT DECLARED';onMajor()}
function route(text){// split dictation by keywords into fields
const kws=[];F.forEach(f=>f[4].forEach(k=>kws.push([k,f[3]])));kws.sort((a,b)=>b[0].length-a[0].length);
const re=new RegExp('\\b('+kws.map(k=>k[0]).join('|')+')\\b','gi');let m,marks=[];
while(m=re.exec(text))marks.push([m.index,m[0].length,kws.find(k=>k[0]==m[0].toLowerCase())[1]]);
if(!marks.length){if(cur)append(cur,text);return}
if(marks[0][0]>0&&cur)append(cur,text.slice(0,marks[0][0]));
marks.forEach((k,i)=>{const seg=text.slice(k[0]+(k[2]=='major'?0:k[1]),i+1<marks.length?marks[i+1][0]:text.length).replace(/^[\s,:.-]*(is|are)?\s*/i,'').trim();cur=k[2];if(seg)append(k[2],seg);else hl(k[2])});}
let cur=null;function hl(id){document.querySelectorAll('.f').forEach(e=>e.classList.toggle('act',e.id=='f_'+id));}
function append(id,t){t=t.trim();if(!t)return;hl(id);if(id=='major')setMajor(t);else{const el=$(id);el.value=(el.value?el.value+' ':'')+t;if(id=='cas')parseCas(el.value)}save()}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,listening=false,guided=-1,onFinal=null;
function mkRec(){const r=new SR();r.lang='en-GB';r.continuous=true;r.interimResults=true;
r.onresult=e=>{let it='';for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal){onFinal?onFinal(x[0].transcript):route(x[0].transcript)}else it+=x[0].transcript}$('live').textContent=it||'Listening…'};
r.onerror=e=>{$('live').textContent='Mic error: '+e.error;if(e.error=='not-allowed')stop()};r.onend=()=>{if(listening)try{r.start()}catch(e){}};return r}
function start(){if(!SR){alert('Speech recognition not supported in this browser — please type. (Use Chrome or Safari.)');return false}
if(!rec)rec=mkRec();listening=true;try{rec.start()}catch(e){}return true}
function stop(){listening=false;onFinal=null;guided=-1;rec&&rec.stop();$('dict').classList.remove('on');$('dict').textContent='🎤 Dictate';$('guided').classList.remove('on');$('guided').textContent='🧭 Guided';hl(null)}
$('dict').onclick=()=>{if(listening)return stop();if(start()){$('dict').classList.add('on');$('dict').textContent='⏹ Stop'}};
function say(t,cb){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;u.onend=cb||null;speechSynthesis.speak(u)}
function step(){if(guided>=F.length){const g=guided;stop();say('METHANE complete. Generating report.');gen();return}
const f=F[guided];hl(f[3]);$('f_'+f[3]).scrollIntoView({behavior:'smooth',block:'center'});
if(rec)rec.abort();listening=false;say(f[1]+'. '+f[2].replace(/e\.g\..*/,'')+'. Say next when done.',()=>{listening=true;try{rec.start()}catch(e){}})}
$('guided').onclick=()=>{if(listening||guided>=0)return stop();if(!SR)return alert('Speech recognition not supported — type into each field.');rec=rec||mkRec();
guided=0;$('guided').classList.add('on');$('guided').textContent='⏹ Stop guided';
onFinal=t=>{const L=t.trim();if(/\b(next|done|skip)\s*$/i.test(L)){append(F[guided][3],L.replace(/\b(next|done|skip)\s*$/i,''));guided++;step()}else if(/^\s*(back|previous)\s*$/i.test(L)){guided=Math.max(0,guided-1);step()}else append(F[guided][3],L)};step()};
$('clear').onclick=()=>{if(confirm('Clear all fields?')){ids.forEach(i=>{if(i!='callsign')$(i).value=''});photos=[];idb('put','draft',[]).catch(()=>{});drawDraft();$('phint').hidden=true;save();$('out').hidden=$('acts').hidden=$('rlogo').hidden=true}};
function mLine(){const v=$('major_s').value,n=$('major').value.trim(),ty=$('type').value.trim().split('\n')[0];
let l=/^MAJOR INCIDENT (DECLARED|STANDBY)$/.test(v)?(ty?`M - ${v}: ${ty}${declStr()}`:`M - ${v}${declStr()}`):`M - MAJOR INCIDENT: ${v||'Not known'}`;return l+(n?'\n    '+n:'')}
function report(){const d=new Date(),pad=x=>String(x).padStart(2,'0'),v=i=>$(i).value.trim()||'Not known';
const c=TRI.map(([k])=>+$(k).value||0),alive=c[0]+c[1]+c[2],tot=c.reduce((a,b)=>a+b,0);
return `METHANE SITREP
DTG: ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())} (local)
FROM: ${$('callsign').value.trim()||'Unknown callsign'}
${mLine()}
E - EXACT LOCATION: ${v('loc')}
T - TYPE OF INCIDENT: ${v('type')}
H - HAZARDS: ${v('haz')}
A - ACCESS: ${v('access')}
N - NUMBER/TYPE OF CASUALTIES: RED ${c[0]} / YELLOW ${c[1]} / GREEN ${c[2]} / BLACK ${c[3]} / WHITE (uninjured, accounted for) ${c[4]} (injured ${alive}, total persons ${tot})${$('cas').value.trim()?'\n    '+$('cas').value.trim():''}
E - EMERGENCY SERVICES: ${v('es')}
SUMMARY / UPDATES: ${v('sum')}${photos.length?'\nPHOTOS: '+photos.length+' attached':''}
END OF REPORT`}
// ---- photos (IndexedDB) ----
let photos=[],lastPhotos=[];
const db=new Promise((ok,no)=>{const r=indexedDB.open('methane',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function idb(m,k,v){const d=await db;return new Promise((ok,no)=>{const t=d.transaction('p',m=='get'?'readonly':'readwrite').objectStore('p');const q=m=='get'?t.get(k):m=='del'?t.delete(k):t.put(v,k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
function shrink(f){return new Promise(ok=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>ok(b),'image/jpeg',.7)};im.onerror=()=>{URL.revokeObjectURL(u);ok(null)};im.src=u})}
function thumbs(el,list,rm){el.innerHTML='';list.forEach((b,i)=>{const sp=document.createElement('span'),im=document.createElement('img');im.src=URL.createObjectURL(b);im.alt='photo '+(i+1);im.onclick=()=>window.open(im.src);sp.appendChild(im);
if(rm){const x=document.createElement('button');x.type='button';x.textContent='✕';x.setAttribute('aria-label','Remove photo');x.onclick=()=>rm(i);sp.appendChild(x)}el.appendChild(sp)})}
function drawDraft(){thumbs($('thumbs'),photos,i=>{photos.splice(i,1);idb('put','draft',photos);drawDraft()})}
idb('get','draft').then(p=>{photos=p||[];drawDraft()}).catch(()=>{});
$('addph').onclick=()=>$('photoin').click();
$('photoin').onchange=async e=>{for(const f of e.target.files){const b=await shrink(f);if(b)photos.push(b)}e.target.value='';idb('put','draft',photos).catch(()=>{});drawDraft()};
$('addupd').onclick=()=>{const d=new Date(),t=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),el=$('sum');el.value=(el.value?el.value+'\n':'')+`[${t}] `;el.focus();el.setSelectionRange(el.value.length,el.value.length);save()};
function files(list){return list.map((b,i)=>new File([b],`methane-photo-${i+1}.jpg`,{type:'image/jpeg'}))}
function showReport(r,ph){last=r;lastPhotos=ph||[];$('out').textContent=r;$('out').hidden=$('acts').hidden=$('rlogo').hidden=false;$('phint').hidden=!lastPhotos.length}
let last='';function gen(){showReport(report(),photos.slice());
const h=getHist();if(!h[0]||h[0].text!==last){const id=Date.now();h.unshift({id,text:last,n:photos.length});if(photos.length)idb('put','r'+id,photos.slice()).catch(()=>{});h.splice(50).forEach(o=>idb('del','r'+o.id).catch(()=>{}));localStorage.methane_hist=JSON.stringify(h)}hist();$('out').scrollIntoView({behavior:'smooth'})}
$('gen').onclick=gen;
function getHist(){return JSON.parse(localStorage.methane_hist||'[]').map((r,i)=>typeof r=='string'?{id:i,text:r,n:0}:r)}
function hist(){const h=getHist();$('hist').innerHTML=h.length?'':'<i>No saved reports</i>';
h.forEach((o,i)=>{const r=o.text,d=document.createElement('div');d.innerHTML=`<b>${r.split('\n')[1]}</b> ${r.split('\n')[2]}${o.n?' · 📷 '+o.n:''}<div class="thumbs"></div><div class="row"><button>View</button><button>Delete</button></div>`;
let ph=[];if(o.n)idb('get','r'+o.id).then(p=>{ph=p||[];thumbs(d.querySelector('.thumbs'),ph)}).catch(()=>{});
const[b1,b2]=d.querySelectorAll('.row button');b1.onclick=()=>{showReport(r,ph);$('out').scrollIntoView()};
b2.onclick=()=>{h.splice(i,1);idb('del','r'+o.id).catch(()=>{});localStorage.methane_hist=JSON.stringify(h);hist()};$('hist').appendChild(d)})}hist();
const enc=encodeURIComponent;
$('share').onclick=async()=>{if(navigator.share){const fl=files(lastPhotos),dt={title:'METHANE Sitrep',text:last};if(fl.length&&navigator.canShare&&navigator.canShare({files:fl}))dt.files=fl;else if(fl.length)alert('This browser cannot share photos; sending text only.');try{await navigator.share(dt)}catch(e){}}else{copy();alert('Share not supported; copied to clipboard')}};
$('sms').onclick=()=>location.href='sms:?&body='+enc(last);
$('email').onclick=()=>location.href='mailto:?subject='+enc('METHANE SITREP '+($('callsign').value||''))+'&body='+enc(last);
async function copy(){try{await navigator.clipboard.writeText(last);return true}catch(e){const t=document.createElement('textarea');t.value=last;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();return true}}
$('copy').onclick=async()=>{await copy();$('copy').textContent='✅ Copied';setTimeout(()=>$('copy').textContent='📋 Copy',1500)};
$('teams').onclick=async()=>{await copy();alert('Report copied. Teams will open — choose a chat and paste if not pre-filled.');location.href='https://teams.microsoft.com/l/chat/0/0?users=&message='+enc(last)};
const PH={M:'Mike',E:'Echo',T:'Tango',H:'Hotel',A:'Alpha',N:'November'};
$('read').onclick=()=>{if(speechSynthesis.speaking){speechSynthesis.cancel();return}
const parts=last.split('\n').map(l=>l.replace(/^([MEHTAN]) - /,(m,a)=>PH[a]+'. ').replace(/\bP([123])\b/g,'Priority $1').replace(/\bDEAD\b/,'dead').replace(/\(injured (\d+), total persons (\d+)\)/,'. Injured $1. Total persons $2').replace(/\//g,', ').replace(/^SUMMARY \/ UPDATES:/,'Summary and updates.').replace(/^PHOTOS:/,'Photos.').replace(/\[(\d\d):(\d\d)\]/g,'at $1$2 hours,').replace(/\bat (\d\d):(\d\d)(?=,|$)/,'at $1$2 hours').replace(/DTG:/,'Date time group.').replace(/https?:\S+/g,'').replace(/(\d)(?=\d)/g,'$1 '));
parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p+(i<parts.length-1?'. Break.':'. Out.'));u.lang='en-GB';u.rate=.8;speechSynthesis.speak(u)})};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
